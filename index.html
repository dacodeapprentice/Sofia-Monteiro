<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Em breve</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #f2f0eb;
            color: #1c1c1c;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }

        /* Subtle background texture */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 0, 0, 0.035) 1px,
                    transparent 1px
                );

            background-size: 22px 22px;

            pointer-events: none;
        }

        .container {
            position: relative;
            width: min(900px, 90%);
            text-align: center;
            padding: 40px;
        }

        /* Decorative circle */
        .circle {
            width: 90px;
            height: 90px;

            margin: 0 auto 45px;

            border: 1px solid #1c1c1c;
            border-radius: 50%;

            position: relative;

            animation: float 4s ease-in-out infinite;
        }

        .circle::after {
            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            background: #1c1c1c;
            border-radius: 50%;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4.5rem);
            font-weight: 400;
            letter-spacing: -0.04em;

            margin-bottom: 25px;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.7;

            max-width: 650px;
            margin: 0 auto;

            color: #555;
        }

        .line {
            width: 60px;
            height: 1px;

            background: #1c1c1c;

            margin: 35px auto;
        }

        .small {
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;

            color: #777;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .circle {
                width: 70px;
                height: 70px;
                margin-bottom: 35px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="circle"></div>

        <div class="small">
            Em construção
        </div>

        <div class="line"></div>

        <h1>
            Este site encontra-se<br>
            sob manutenção.
        </h1>

        <p>
            E ficará disponível em breve.<br>
            Obrigada pela visita!
        </p>

    </main>

</body>
</html>
